name: Setup or runtime problem / 安装或运行问题
description: Report a reproducible problem with redacted details.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Never paste keys, account IDs, tunnel/workspace IDs, private chat links, personal paths, or document contents. 请先删除日志中的隐私信息。"
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Windows, Node, and kit version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
      description: Use disposable files and generic paths.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error / 实际表现与脱敏错误
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed credentials, personal identifiers, file contents, and private runtime data.
          required: true
